function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function diff(h1,h2){const[r1,g1,b1]=hexToRgb(h1),[r2,g2,b2]=hexToRgb(h2);return Math.sqrt((r2-r1)**2+(g2-g1)**2+(b2-b1)**2);}

function update(hex){
  document.getElementById('bigSwatch').style.background=hex;
  document.getElementById('hexVal').textContent=hex.toUpperCase();
  const[r,g,b]=hexToRgb(hex);
  document.getElementById('rgbVal').textContent=`RGB ${r} · ${g} · ${b}`;
  const sorted=Object.entries(P).map(([n,c])=>({n,c,d:diff(hex,c)})).sort((a,b)=>a.d-b.d).slice(0,30);
  document.getElementById('grid').innerHTML=sorted.map((p,i)=>`
    <div class="card">
      <div class="card-swatch" style="background:${p.c}"></div>
      <div class="card-body">
        <div class="card-name">${p.n}${i===0?'<span class="best-badge">Top</span>':''}</div>
        <div class="card-hex">${p.c.toUpperCase()}</div>
        <div class="card-diff">Δ ${Math.round(p.d)}</div>
      </div>
    </div>`).join('');
}

const picker=document.getElementById('colorPicker');
picker.addEventListener('input',e=>update(e.target.value));
update(picker.value);
</script>
